<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tela de Cadastro</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="d-flex">

        
        <aside id="sidebar"></aside>
        
        <div class="flex-grow-1 px-4" style="min-width: 0;">

        <header id="topo"></header>

   <main class="area-principal">
 
        <p class="pagina-migalha">Usinas › Cadastrar</p>
        <h1 class="pagina-titulo">Cadastrar usina</h1>
        
        <div class="usina-card">
            <div class="usina-grid">
        
            <div class="campo" id="f-nome">
                <label for="nome">Nome da usina <span class="campo-obrigatorio">*</span></label>
                <div class="campo-entrada">
                <input id="nome" placeholder="Ex: Usina Solar 1" autocomplete="off" maxlength="60">
                </div>
                <div class="campo-ajuda"></div>
            </div>
        
            <div class="campo" id="f-fab">
                <label for="fab">Fabricante do inversor <span class="campo-obrigatorio">*</span></label>
                <div class="campo-entrada">
                <input id="fab" list="fabs" placeholder="Ex: Fronius" autocomplete="off">
                </div>
                <datalist id="fabs">
                <option>Fronius</option><option>Growatt</option><option>Huawei</option>
                <option>SMA</option><option>Sungrow</option><option>GoodWe</option>
                <option>Deye</option><option>Solis</option><option>ABB</option>
                </datalist>
                <div class="campo-ajuda">Escolha da lista ou digite outro fabricante.</div>
            </div>
        
            <div class="campo" id="f-pot">
                <label for="pot">Potência instalada <span class="campo-obrigatorio">*</span></label>
                <div class="campo-entrada com-unidade">
                <input id="pot" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Ex: 136">
                <span class="campo-unidade">kWp</span>
                </div>
                <div class="campo-ajuda"></div>
            </div>
        
            <div class="campo" id="f-qtd">
                <label for="qtd">Quantidade de inversores <span class="campo-obrigatorio">*</span></label>
                <div class="campo-entrada com-passo">
                <input id="qtd" type="number" inputmode="numeric" min="1" step="1" placeholder="Ex: 3">
                <div class="campo-passo">
                    <button type="button" data-d="-1" aria-label="Diminuir">−</button>
                    <button type="button" data-d="1" aria-label="Aumentar">+</button>
                </div>
                </div>
                <div class="campo-ajuda"></div>
            </div>
        
            <div class="usina-resumo" id="sum"></div>
            </div>
        </div>
        
        <div class="usina-acoes">
            <button class="botao botao-secundario" id="cancel" type="button">Cancelar</button>
            <button class="botao botao-primario" id="save" type="button">Cadastrar usina</button>
        </div>
        
    </main>
 
<div class="aviso-sucesso" id="toast" role="status"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/sidebar.js"></script>

</body>
</html>
