<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Usinas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/TelaUsinasGeral.css">
    
</head>
<body>
    <div class="d-flex">

        <aside class="p-4">
            <h2>Sistema Solar</h2>

            <a href="TelaPrincipal.html">Painel Principal</a>
            <a href="TelaUsinasGeral.html">Usinas</a>
            <a href="TelaCadastrarUsina.html">Cadastrar</a>
            <a href="login.html">Sair</a>
        </aside>

        <main class="p-4 flex-grow-1">

            <h1>Usinas</h1>

            <div class="d-flex align-items-center gap-3 mb-4">

                <div class="flex-grow-1"> <input class="form-control busca" type="search" 
                    placeholder="Pesquisar usina..." aria-label="Pesquisar usina" > 
                </div>
                <a href="TelaCadastrarUsina.html" class="btn btn-sm btn-primary"> 
                    <i class="bi bi-plus-circle me-2"></i> Cadastrar usina </a> 
                </div>

            <div class="card shadow-sm p-3 table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead>
                        <tr class="table-light">
                            <th>Usina</th>
                            <th>Status</th>
                            <th>Produção hoje</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody  id="listaUsinas"></tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/TelaPrincipal.js"></script>

</body>
</html>
