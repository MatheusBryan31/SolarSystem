<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#092648" />
    <meta name="description" content="Acesse o SolarSystem e acompanhe o monitoramento de usinas fotovoltaicas." />
    <title>Entrar | SolarSystem</title>
    <link rel="preload" as="image" href="imgs/foto_login.jpeg" />
    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="login-ajustes.css" />
    <script src="app.js" defer></script>
    <script src="login.js" defer></script>
  </head>
  <body class="login-page" data-page="login">
    <!-- Ícones locais sem dependência de bibliotecas externas. -->
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-4.5 6-4.5 9s1.5 6 4.5 9m0-18c3 3-4.5 6-4.5 9s1.5 6 4.5 9"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.7-6 9.5-6 9.5 6 9.5 6-3.7 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M10.3 6.2c.55-.13 1.12-.2 1.7-.2 5.8 0 9.5 6 9.5 6a16.6 16.6 0 0 1-3.6 4.1M6.2 6.6C3.9 8.2 2.5 12 2.5 12s3.7 6 9.5 6c1.15 0 2.24-.23 3.24-.62M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    </svg>

    <header class="login-header">
      <div class="login-header-inner">
        <div class="login-logo" aria-label="SolarSystem">Solar<span>System</span></div>
        <div class="login-header-actions">
          <button class="header-language" type="button" data-demo-message="O SolarSystem está disponível em português nesta demonstração.">
            <svg class="icon"><use href="#i-globe"/></svg>
            <span>Português</span>
            <svg class="icon icon-chevron"><use href="#i-chevron"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="login-main">
      <div class="login-card">
        <section class="login-hero" aria-labelledby="hero-heading">
          <div class="login-hero-copy">
            <span class="hero-accent" aria-hidden="true"></span>
            <h1 id="hero-heading">Monitoramento inteligente para suas usinas solares</h1>
            <p>Acompanhe a performance, alertas e a operação das suas usinas em um só lugar.</p>
          </div>
        </section>

        <section class="login-content" aria-labelledby="login-title">
          <div class="login-intro">
            <h2 id="login-title">Bem-vindo ao SolarSystem</h2>
            <p>Entre com seu e-mail e senha para acessar suas usinas.</p>
          </div>

          <form id="login-form" class="login-form">
            <div class="form-field">
              <label for="login-email">E-mail</label>
              <div class="input-wrapper">
                <svg class="icon field-icon"><use href="#i-mail"/></svg>
                <input id="login-email" name="email" type="email" placeholder="Seu e-mail" autocomplete="username" inputmode="email" required />
              </div>
            </div>
            <div class="form-field">
              <label for="login-password">Senha</label>
              <div class="input-wrapper password-wrapper">
                <svg class="icon field-icon"><use href="#i-lock"/></svg>
                <input id="login-password" name="password" type="password" placeholder="Sua senha" autocomplete="current-password" required />
                <button id="toggle-password" class="password-toggle" type="button" aria-label="Mostrar senha" aria-controls="login-password" aria-pressed="false" title="Mostrar senha">
                  <svg class="icon" aria-hidden="true"><use id="toggle-password-icon" href="#i-eye-off"/></svg>
                </button>
              </div>
            </div>

            <div class="login-options">
              <label class="remember-label" for="remember-email">
                <input id="remember-email" type="checkbox" />
                <span>Lembrar e-mail</span>
              </label>
              <button class="text-link" type="button" data-demo-message="A recuperação de senha será implementada junto com a autenticação no back-end.">Esqueci a senha</button>
            </div>

            <button class="login-submit" type="submit">Entrar</button>
            <div class="login-bottom-links">
              <button class="create-account" type="button" data-demo-message="O cadastro de contas será disponibilizado após a implementação do back-end.">Criar conta</button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <footer class="login-footer">
      <nav aria-label="Informações do SolarSystem">
        <button type="button" data-demo-message="O manual do usuário ainda está em preparação.">Manual do usuário</button>
        <span aria-hidden="true">|</span>
        <button type="button" data-demo-message="Os termos de serviço ainda não estão publicados.">Termos de Serviço</button>
        <span aria-hidden="true">|</span>
        <button type="button" data-demo-message="A política de privacidade ainda não está publicada.">Política de privacidade</button>
        <span aria-hidden="true">|</span>
        <button type="button" data-demo-message="As preferências de cookies estarão disponíveis em uma versão futura.">Configurações de Cookies</button>
      </nav>
      <p>© <span id="copyright-year">2026</span> SolarSystem. Todos os direitos reservados.</p>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
