<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#092648" />
    <meta
      name="description"
      content="Acesse o SolarSystem e acompanhe o monitoramento de usinas fotovoltaicas."
    />
    <title>Entrar | SolarSystem</title>
    <link rel="preload" as="image" href="../imgs/foto_login.jpeg" />
    <link rel="stylesheet" href="../estilos/styles.css" />
    <link rel="stylesheet" href="../estilos/login.css" />
    <script src="../scripts/login.js" defer></script>
    <script src="../scripts/registration.js" defer></script>
  </head>
  <body class="login-page" data-page="login">
    <!-- Ícones locais sem dependência de bibliotecas externas. -->
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <symbol id="i-user-plus" viewBox="0 0 24 24">
        <circle cx="9" cy="7" r="4" />
        <path d="M2 21v-2a7 7 0 0 1 14 0v2m3-13v6m-3-3h6" />
      </symbol>
      <symbol id="i-mail" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="m3 7 9 6 9-6" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="10" width="14" height="11" rx="2" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2.5 12s3.7-6 9.5-6 9.5 6 9.5 6-3.7 6-9.5 6-9.5-6-9.5-6Z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24">
        <path
          d="m3 3 18 18M10.3 6.2c.55-.13 1.12-.2 1.7-.2 5.8 0 9.5 6 9.5 6a16.6 16.6 0 0 1-3.6 4.1M6.2 6.6C3.9 8.2 2.5 12 2.5 12s3.7 6 9.5 6c1.15 0 2.24-.23 3.24-.62M9.9 9.9a3 3 0 0 0 4.2 4.2"
        />
      </symbol>
    </svg>

    <header class="login-header">
      <div class="login-header-inner">
        <div class="login-logo" aria-label="SolarSystem">Solar<span>System</span></div>
        <button
          class="create-account"
          type="button"
          id="open-registration"
          aria-haspopup="dialog"
          aria-controls="registration-dialog"
        >
          <svg class="icon" aria-hidden="true"><use href="#i-user-plus" /></svg>
          <span>Criar conta</span>
        </button>
      </div>
    </header>

    <main class="login-main">
      <div class="login-card">
        <section class="login-hero" aria-labelledby="hero-heading">
          <div class="login-hero-copy">
            <span class="hero-accent" aria-hidden="true"></span>
            <h1 id="hero-heading">Suas usinas, em um só lugar.</h1>
            <p>Acompanhe a geração, os alertas e o desempenho.</p>
          </div>
        </section>

        <section class="login-content" aria-labelledby="login-title">
          <div class="login-intro">
            <h2 id="login-title">Acesse suas usinas</h2>
            <p>Demonstração local. Use e-mail e senha fictícios.</p>
          </div>

          <form id="login-form" class="login-form" method="dialog">
            <div class="form-field">
              <label for="login-email">E-mail</label>
              <div class="input-wrapper">
                <svg class="icon field-icon"><use href="#i-mail" /></svg>
                <input
                  id="login-email"
                  name="email"
                  type="email"
                  placeholder="Seu e-mail"
                  autocomplete="username"
                  maxlength="254"
                  inputmode="email"
                  required
                />
              </div>
            </div>
            <div class="form-field">
              <label for="login-password">Senha</label>
              <div class="input-wrapper password-wrapper">
                <svg class="icon field-icon"><use href="#i-lock" /></svg>
                <input
                  id="login-password"
                  name="password"
                  type="password"
                  pattern=".*\S.*"
                  title="Inclua pelo menos um caractere diferente de espaço."
                  placeholder="Sua senha"
                  autocomplete="current-password"
                  required
                />
                <button
                  id="toggle-password"
                  class="password-toggle"
                  type="button"
                  aria-label="Mostrar senha"
                  aria-controls="login-password"
                  aria-pressed="false"
                  title="Mostrar senha"
                >
                  <svg class="icon" aria-hidden="true">
                    <use id="toggle-password-icon" href="#i-eye-off" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="login-options">
              <label class="remember-label" for="remember-email">
                <input id="remember-email" type="checkbox" />
                <span>Lembrar e-mail</span>
              </label>
              <button
                class="text-link"
                type="button"
                data-demo-message="A recuperação de senha será implementada junto com a autenticação no back-end."
              >
                Esqueci a senha
              </button>
            </div>

            <button class="login-submit" type="submit">Entrar na demonstração</button>
          </form>
        </section>
      </div>
    </main>

    <footer class="login-footer">
      <p>© <span id="copyright-year">2026</span> SolarSystem. Todos os direitos reservados.</p>
    </footer>

    <dialog id="registration-dialog" class="registration-dialog" aria-labelledby="registration-title">
      <button id="close-registration" class="registration-close" type="button" aria-label="Fechar cadastro">
        ×
      </button>
      <h2 id="registration-title">Simular cadastro</h2>
      <form id="registration-form" class="login-form" method="dialog">
        <div class="form-field">
          <label for="registration-name">Nome completo</label>
          <div class="input-wrapper">
            <input
              id="registration-name"
              name="name"
              autocomplete="name"
              minlength="2"
              maxlength="120"
              required
              autofocus
            />
          </div>
        </div>
        <div class="form-field">
          <label for="registration-email">E-mail</label>
          <div class="input-wrapper">
            <input
              id="registration-email"
              name="email"
              type="email"
              autocomplete="email"
              maxlength="254"
              required
            />
          </div>
        </div>
        <div class="form-field">
          <label for="registration-password">Senha</label>
          <div class="input-wrapper password-wrapper">
            <input
              id="registration-password"
              name="password"
              type="password"
              pattern=".*\S.*"
              title="Inclua pelo menos um caractere diferente de espaço."
              autocomplete="new-password"
              required
            />
            <button
              id="registration-toggle-password"
              class="password-toggle"
              type="button"
              aria-label="Mostrar senha"
              aria-controls="registration-password"
              aria-pressed="false"
            >
              <svg class="icon" aria-hidden="true"><use href="#i-eye-off" /></svg>
            </button>
          </div>
        </div>
        <button class="login-submit" type="submit">Simular cadastro</button>
      </form>
      <p
        id="registration-message"
        class="registration-message"
        role="status"
        aria-live="polite"
        tabindex="-1"
        hidden
      ></p>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
