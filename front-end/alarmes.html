<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Alarmes | SolarSystem
    </title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer>
    </script>
  </head>
    <body data-page="alarms">
      <div class="app-shell">

        <aside class="sidebar" id="sidebar-container"></aside>
        
        <main class="main">
        <div class="topbar">
          <span class="eyebrow">
            Monitoramento de usinas solares
          </span>
          <a class="user-chip" href="login.html">
            Sair
          </a>
        </div>
        <div class="page-heading">
          <div>
            <h1>
              Alarmes
            </h1>
            <p class="subheading">
              Ocorrências registradas nas usinas.
            </p>
          </div>
        </div>
        <article class="card card-pad">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>
                    Data e hora
                  </th>
                  <th>
                    Usina
                  </th>
                  <th>
                    Alarme
                  </th>
                  <th>
                    Severidade
                  </th>
                  <th>
                    Status
                  </th>
                  <th>
                    Ação
                  </th>
                </tr>
              </thead>
              <tbody id="alarm-rows">
              </tbody>
            </table>
          </div>
        </article>
      </main>
    </div>
    <div id="toast" class="toast" role="status">
    </div>
    <script src="sidebar.js"></script>
  </body>
</html>
