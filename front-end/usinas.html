<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Usinas | SolarSystem
    </title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer>
    </script>
  </head>

    <aside class="sidebar" id="sidebar-container"></aside>

      <main class="main">
        <div class="topbar">
          <span class="eyebrow">
            Monitoramento de usinas solares
          </span>
          <a class="user-chip" href="login.html">
            Sair
          </a>
        </div>
        <div class="page-heading">
          <div>
            <h1>
              Usinas
            </h1>
            <p class="subheading">
              Gerencie e monitore todas as instalações.
            </p>
          </div>
          <a class="button button-primary" href="cadastro.html">
            ＋ Nova usina
          </a>
        </div>
        <div class="toolbar">
          <label class="search-field">
            <input id="plant-search" class="field-control" type="search" placeholder="Buscar por nome ou número de série">
          </label>
          <select id="status-filter" class="field-control">
            <option value="">
              Todos os status
            </option>
            <option>
              Online
            </option>
            <option>
              Atenção
            </option>
            <option>
              Offline
            </option>
          </select>
        </div>
        <section class="grid summary-grid">
          <article class="card summary-tile">
            <div>
              <span>
                Todas
              </span>
              <strong id="total-count">
                0
              </strong>
            </div>
          </article>
          <article class="card summary-tile">
            <div>
              <span>
                Online
              </span>
              <strong id="online-count">
                0
              </strong>
            </div>
          </article>
          <article class="card summary-tile">
            <div>
              <span>
                Atenção
              </span>
              <strong id="attention-count">
                0
              </strong>
            </div>
          </article>
          <article class="card summary-tile">
            <div>
              <span>
                Offline
              </span>
              <strong id="offline-count">
                0
              </strong>
            </div>
          </article>
        </section>
        <article class="card card-pad">
          <div class="pagination">
            <span id="result-count">
            </span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>
                    Usina / N/S
                  </th>
                  <th>
                    Localização
                  </th>
                  <th>
                    Status
                  </th>
                  <th>
                    Potência
                  </th>
                  <th>
                    Inversores
                  </th>
                  <th>
                    Ação
                  </th>
                </tr>
              </thead>
              <tbody id="plant-rows">
              </tbody>
            </table>
          </div>
        </article>
      </main>
    </div>
    <div id="toast" class="toast" role="status">
    </div>

    <script src="sidebar.js"></script>
    
  </body>
</html>
