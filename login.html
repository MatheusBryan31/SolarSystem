<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="shortcut icon" href="assets/img/favicon/Arturo-Wibawa-Akar-Planet.512 (1).png" type="image/x-icon">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">        
        <link rel="stylesheet" href="assets/css/login.css">
        <title>SolarSystem</title>
    </head>
    <body>
        <main class="d-flex min-vh-100">
            <!-- PRIMEIRA SEÇÃO -->
            <section class="area-apresentacao d-flex flex-column justify-content-between p-4"></section>

            <!-- SEGUNDA SEÇÃO -->
            <section class="area-login d-flex flex-column justify-content-center align-items-center position-relative">
                <!-- Elementos "Servidor" e "Idioma" -->
                <div class="topo-direito d-flex aligns-items-center gap-3">
                    <!-- Seletor do "Servidor" -->
                    <div class="dropdown">
                        <button class="btn btn-sm fontesSecundarias dropdown-toggle border-0 bg-transparent" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="font-size: 13px"> <!-- Olhe a fonte, Bryan -->
                            <i class="bi bi-hdd-rack"></i> Servidor Latino
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark" style="font-size: 13px">
                            <li><a href="#" class="dropdown-item">Servidor Latino</a></li>
                            <li><a href="#" class="dropdown-item">Servidor Europeu</a></li>
                        </ul>
                    </div>

                    <!-- Seletor de "Idioma" -->
                    <div class="dropdown">
                        <button class="btn btn-sm text-secondary dropdown-toggle border-0 bg-transparent" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="font-size: 13px">
                            <i class="bi bi-globe"></i> Português
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark" style="font-size: 13px">
                            <li><a href="#" class="dropdown-item">Português</a></li>
                            <li><a href="#" class="dropdown-item">Espanhol</a></li>
                            <li><a href="#" class="dropdown-item">Inglês</a></li>
                        </ul>
                    </div>
                </div>

                <!-- FORMULÁRIO -->
                <form action="TelaPrincipal.html" class="formulario-login">
                    <h2 class="fontesPrimarias" data-i18n="boasVindas">Bem vindo a SolarSystem</h2>
                    <p class="fontesSecundarias" data-i18n="acesseConta">Acesse sua conta para continuar</p>
                    
                    <!-- Input do e-mail -->
                    <div class="mb-3">
                        <input type="email" name="email" id="email" class="form-control" placeholder="Digite o seu e-mail" required autocomplete="email" title="Preencha este campo" data-i18n="campoEmail">
                    </div>

                    <!-- Input da senha -->
                    <div class="mb-1">
                        <!-- Div para envolver o input==password para ser possível a visualização da senha -->
                        <div class="input-group">
                            <input type="password" name="senha" id="senha" class="form-control" placeholder="Digite a sua senha" required autocomplete="current-password">
                            <button type="button" id="mostrarSenha" class="btn btn-outline-secondary">
                                <!-- Ícone -->
                                 <i class="bi bi-eye" id="iconeSenha"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center w-100" style="font-size: 14px">
                        <!-- Memorizar senha -->
                        <div class="form-check d-flex align-items-center gap-2 m-0 p-0">
                            <input class="form-check-input m-0" type="checkbox" name="lembrarSenha" id="lembrarSenha">
                            <label class="form-check-label fontesTerciarias" for="lembrarSenha" style="cursor:pointer" data-i18n="lembrarSenha">
                                Lembrar Senha
                            </label>
                        </div>

                        <!-- Âncora para recuperar a senha -->
                        <div>
                            <!-- Link para recuperação de senha. Como será feita essa recuperação?? -->
                            <a href="telaRecuperarSenha.html" target="_blank" title="Recuperar Senha" name="esqueciSenha" id="esqueciSenha" class="text-decoration-none fontesTerciarias" data-i18n="esqueciSenha">Esqueci minha senha</a>
                        </div>
                    </div>

                    <!-- Botão para logar -->
                    <div>
                        <div style="margin-top: 50px">
                        <button type="submit" class="btn btn-primary w-100" title="Entrar" data-i18n="entrar">
                            Entrar
                        </button>
                        </div>
                        <div class="text-center">
                            <a href="telaRegistro.html" target="_blank" title="Criar conta" class="fontesTerciarias  text-decoration-none" data-i18n="registrar">Registrar</a>
                        </div>
                    </div>

                    <!-- Botões "Termos de Serviço" e "Política de privacidade" -->
                     <div style="transform: translateY(99px)" class="text-center">
                        <a href="telaTermosDeServico.html" target="_blank" title="Termos de Serviço" class="fontesTerciarias text-decoration-none" data-i18n="termos">Termos de Serviço</a>
                        <span>
                            |
                        </span>
                        <a href="telaPoliticasDePrivacidade.html" target="_blank" title="Políticas de Privacidade" class="fontesTerciarias text-decoration-none" data-i18n="politicas">Políticas de Privacidade</a>

                        <!-- Copyright -->
                        <div class="text-center fontesQuarternarias">
                            <p data-i18n="direitos">&copy; SS 2026 todos os direitos reservados.</p>
                        </div>
                     </div>
                </form>
            </section>
        </main>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="assets/js/login.js"></script>
    </body>
</html>
