<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- MB: https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css -->
        <!-- BsT: https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css -->
        <link rel="stylesheet" href="">
        <link rel="stylesheet" href="assets/css/login.css">
        <title>SolarSystem</title>
    </head>
    <body>
        <main class="d-flex min-vh-100">
            <section class="area-apresentacao"></section>
            <section class="area-login d-flex justify-content-center align-items-center">
                <form action="" class="formulario-login">
                    <h2>Bem vindo!</h2>
                    <p>Acesse sua conta para continuar</p>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="Digite o seu e-mail" required autocomplete="email">
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" name="senha" id="senha" class="form-control" placeholder="Digite a sua senha" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100" title="Enviar">Entrar</button>
                </form>
            </section>
        </main>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="assets/js/login.js"></script>
    </body>
</html>
